name: iOS

on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build and test
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS-26" in k for x in v if x["name"].startswith("iPhone")))')
          set -o pipefail
          xcodebuild test \
            -project Farline.xcodeproj \
            -scheme Farline \
            -destination "id=$SIM" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E '(error|warning: .*deprecated|Test (Suite|Case)|✔|✘|\*\* (BUILD|TEST))' || (tail -200 build.log; exit 1)
