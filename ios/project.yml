# Generate the Xcode project with XcodeGen: `brew install xcodegen && xcodegen`
name: Farline
options:
  bundleIdPrefix: dev.farline
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Farline:
    type: application
    platform: iOS
    sources:
      - path: Farline
    info:
      path: Farline/Info.plist
      properties:
        CFBundleDisplayName: Farline
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Farline is self-hosted: plain http on a LAN or a tailnet is common.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Farline connects to the Farline server on your network.
        NSMicrophoneUsageDescription: Farline listens while you dictate a message.
        NSSpeechRecognitionUsageDescription: Farline turns what you say into the message you're writing.
        # Only standard HTTPS: skips the export compliance question on upload.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.farline.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  FarlineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FarlineTests
    dependencies:
      - target: Farline
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Farline:
    build:
      targets:
        Farline: all
        FarlineTests: [test]
    test:
      targets:
        - FarlineTests
